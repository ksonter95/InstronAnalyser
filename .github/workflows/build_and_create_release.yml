name: Build Executables

on:
  push:
    tags:
      - 'v*'
  pull_request:
    branches:
      - master

jobs:
  build-windows:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'windows' || inputs.target == 'all' }}
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build Windows executable
        run: |
          make dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MechAnalyser-windows-x64
          path: dist/MechAnalyser

  build-macos-arm:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'macos-arm' || inputs.target == 'all' }}
    runs-on: macos-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Print CPU architecture
        run: uname -m

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build MacOS executable
        run: |
          make dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MechAnalyser-macos-arm64
          path: dist/MechAnalyser.app

  build-macos-x86_64:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'macos-x86_64' || inputs.target == 'all' }}
    runs-on: macos-15-intel
    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Print CPU architecture
        run: uname -m

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: 3.12

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller -r requirements.txt

      - name: Build MacOS executable
        run: |
          make dist

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: MechAnalyser-macos-x64
          path: dist/MechAnalyser.app

  create-release:
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    needs: [build-windows, build-macos-arm, build-macos-x86_64]
    permissions:
      contents: write
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@v8
        with:
          name: MechAnalyser-windows-x64
          path: artifacts
          skip-decompress: true

      - name: Download MacOS-ARM artifact
        uses: actions/download-artifact@v8
        with:
          name: MechAnalyser-macos-arm64
          path: artifacts
          skip-decompress: true

      - name: Download MacOS-x86_64 artifact
        uses: actions/download-artifact@v8
        with:
          name: MechAnalyser-macos-x64
          path: artifacts
          skip-decompress: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            Automatically created release for tag ${{ github.ref_name }}
          files: |
            artifacts/MechAnalyser-windows-x64.zip
            artifacts/MechAnalyser-macos-arm64.zip
            artifacts/MechAnalyser-macos-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
